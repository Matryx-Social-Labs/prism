[project]
name = "prism"
version = "0.1.0"
description = "Prism — role-aware news intelligence platform (backend + pipeline)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langfuse>=3.0",
    "openai>=1.60",
    "fastembed>=0.5",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
    "structlog>=26.1.0",
    "networkx>=3.3",  # story-timeline community detection (pure-Python, small graphs)
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "common",
    "ingestion",
    "classification",
    "enrichment",
    "correlation",
    "personalization",
    "agent",
    "api",
    "worker",
    "evals",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Depends() in argument defaults is the canonical FastAPI pattern
"api/**" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
