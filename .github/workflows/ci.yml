name: CI

on:
  push:
    branches: [main, dev]
  # Run on main to force a web deploy — e.g. after changing an env var in the
  # Vercel dashboard, which no diff can see: `gh workflow run ci.yml --ref main`.
  workflow_dispatch:
  pull_request:
    branches: [dev]  # feature branches land on dev; main is never a PR target

# Cancel in-progress runs on the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# main is production. It only ever receives a fast-forward of a commit that
# already passed these jobs on dev, and a ruleset on main refuses any push
# whose commit does not carry green `backend` and `web` checks. So on main the
# verify jobs are SKIPPED — re-running them would test the same SHA twice —
# and the deploy runs after `vouched` re-reads those checks from the API.
jobs:
  backend:
    name: backend · lint + import + migrate + tests
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04  # pinned: `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19; we upgrade on purpose, not by label drift
    timeout-minutes: 10

    # Real Postgres (pgvector) + Redis so `alembic upgrade head` runs and the
    # DB-dependent tests (atomic quota, auth flow, Redis single-flight) actually
    # execute instead of skipping. A broken migration now fails CI, not Railway.
    # (Scale/container-specific failures like the HNSW /dev/shm overflow still
    # won't reproduce on an empty CI DB — this catches migration logic + schema.)
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism -d prism"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://prism:prism@localhost:5432/prism
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Design tokens → globals.css is current
        run: uv run python design/gen_css.py --check

      - name: Import check (catches wiring errors without infra)
        run: |
          uv run python -c "
          import api.main, worker.__main__
          import ingestion.runner, classification.consumer
          import enrichment.consumer, correlation.consumer
          import agent.rag, personalization.ranking, common.lenses
          print('all modules import cleanly')"

      - name: Migrate (exercises alembic upgrade head + downgrade)
        # upgrade builds the whole schema; a down/up round-trip proves each
        # migration's downgrade too. Catches the class of bug that slipped to
        # Railway (a migration that fails `alembic upgrade head`).
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Run tests (PRISM_REQUIRE_DB=1 — a DB test that cannot reach a DB FAILS)
        # Without this, a Postgres service that failed to start turns ~88
        # assertions across 20 modules into silent skips and CI still reports
        # green. Skip-as-pass is this suite's biggest structural risk: an
        # event-loop bug once made real failures surface as "no database".
        env:
          PRISM_REQUIRE_DB: "1"
        run: uv run pytest -q

  web:
    name: web · test + typecheck + build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04  # pinned: `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19; we upgrade on purpose, not by label drift
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test (vitest)
        run: npm test

      - name: Lint (eslint — rules-of-hooks and exhaustive-deps were never enforced before 0.0.86)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        # The job has been NAMED "test + typecheck + build" while never running
        # a typecheck — typing was only whatever `next build` happened to catch.
        run: npx tsc --noEmit

      - name: Build (same as Vercel)
        # Catches Next.js prerender / type / lint errors before Vercel does.
        env:
          # Public env Next embeds into the bundle; CI uses a placeholder.
          NEXT_PUBLIC_API_URL: 'http://localhost:8000'
        # Retries only a next/font Google fetch failure (scripts/retry-next-font.sh).
        run: ./scripts/retry-next-font.sh npm run build

      - name: No labelling guide in the public bundle
        # The guides are served by the API to applicants and a batch's own
        # invites only (common/label_guides.py); a sentence of one in
        # .next/static would hand them to anyone who opens the site.
        run: npm run check:guides

      - name: Chart library only on /admin
        # Recharts is ~130 kB; a reader page must never download it
        # (scripts/check-admin-only.mjs).
        run: npm run check:charts

      - name: Cached routes refresh on their declared clocks
        # A route re-renders at its shortest fetch, so a page's own revalidate
        # can be undercut without a trace; both sitemaps were, down to 60 s
        # (scripts/check-cache-windows.mjs).
        run: npm run check:cache

  vouched:
    # The commit on main must already carry green backend + web checks — the
    # ones its run on dev produced. The ruleset on main enforces the same
    # thing at push time; this makes the deploy depend on it explicitly and
    # names the failure if someone ever bypasses the ruleset.
    name: main · this commit passed CI on dev
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04  # pinned: `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19; we upgrade on purpose, not by label drift
    timeout-minutes: 3
    steps:
      - name: Require green backend + web checks on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in "backend · lint + import + migrate + tests" "web · test + typecheck + build"; do
            ok=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
                  --jq "[.check_runs[] | select(.name == \"$name\" and .conclusion == \"success\")] | length")
            if [ "$ok" = "0" ]; then
              echo "::error::no successful '$name' check on ${{ github.sha }}. Promote from dev after CI is green; never push an untested commit to main."
              exit 1
            fi
            echo "✓ $name"
          done

  deploy-web:
    # Vercel Hobby blocks the GitHub integration on private org repos, so
    # we deploy via the Vercel CLI from CI instead. Runs only on pushes to
    # main, after `vouched` confirms the commit's dev checks.
    name: Deploy web to Vercel (production)
    needs: [vouched]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04  # pinned: `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19; we upgrade on purpose, not by label drift
    timeout-minutes: 15
    concurrency:
      # Serialize production deploys so two pushes in quick succession
      # don't race each other to upload.
      group: deploy-web-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the next step diffs against whichever commit is live

      - name: Skip when nothing the web is built from changed
        # Every deploy starts Vercel's page cache empty ("each new deployment
        # uses its own ISR cache"), and every promote used to redeploy the web,
        # backend-only ones included: 3-11 a day (2026-09-27). The diff is taken
        # against the commit that is LIVE — the deployment the production domain
        # points at, so a rollback moves the baseline too — stamped as
        # meta.prismSha below; never against the previous push, so a failed or
        # skipped deploy cannot hide a web change. Unknown live commit, or a
        # manual run: deploy.
        id: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD_HOST: www.readprism.news  # the canonical host, as pinned in "Inject public build env"
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "manual run: deploying"; exit 0
          fi
          live=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$PROD_HOST?teamId=$VERCEL_ORG_ID" \
            | jq -r '.meta.prismSha // empty') || live=""
          if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null \
             && git diff --quiet "$live" "$GITHUB_SHA" -- web/ vercel.json .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### Web unchanged since ${live:0:7} (live) — deploy skipped, page cache kept" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "deploying: the web changed since the live commit (${live:-unknown})"
          fi

      - name: Setup Node
        if: steps.web.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Re-author HEAD for Vercel's Hobby-plan owner check
        if: steps.web.outputs.changed == 'true'
        # Vercel Hobby only lets the project owner deploy: it checks the
        # commit author email against the owner's verified email. Commits
        # here are authored by whoever wrote the change (good for GitHub
        # history), but Vercel doesn't recognize those emails. Amend HEAD
        # locally inside the runner — never pushed back — so the CLI sends
        # the owner's email for this deploy.
        run: |
          git config user.email "contact@matrixsociallabs.com"
          git config user.name "Prism Deploy"
          git commit --amend --reset-author --no-edit

      - name: Install Vercel CLI
        if: steps.web.outputs.changed == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel project + env (production)
        if: steps.web.outputs.changed == 'true'
        # Downloads project config and prod env vars into .vercel/ so the
        # build below uses exactly the env Vercel would. The Vercel
        # project's Root Directory must be set to `web`.
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Inject public build env
        if: steps.web.outputs.changed == 'true'
        # The Vercel team forces env vars to "Sensitive", and sensitive
        # values pull as EMPTY strings outside Vercel's own builders — so a
        # prebuilt CI deploy would bake "" into the client bundle. These vars
        # are public by definition (NEXT_PUBLIC_* ships in the JS), so pin them
        # here deterministically instead.
        #
        # SITE_URL matters as much as the API URL: it is the base for og:url,
        # canonical and the sitemap. Unset, lib/site.ts falls back to VERCEL_URL
        # (the per-DEPLOYMENT host, which changes every push, so shared links rot)
        # and then to localhost — which is what the sitemap was actually serving.
        #
        # THIS LINE IS THE CANONICAL DOMAIN. Because it is pinned here, changing
        # the domain in the Vercel dashboard does nothing — this overwrites it on
        # every build. It must be the host that answers 200, not one that
        # redirects: the apex readprism.news 308s to www, so canonical points at
        # www or it names a URL that immediately moves. If the apex is ever made
        # primary in Vercel, flip this in the same commit.
        run: |
          for f in .vercel/.env.production.local web/.vercel/.env.production.local; do
            [ -f "$f" ] || continue
            grep -vE '^(NEXT_PUBLIC_API_URL|NEXT_PUBLIC_SITE_URL|NEXT_PUBLIC_GOOGLE_CLIENT_ID)=' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            echo 'NEXT_PUBLIC_API_URL="https://api.readprism.news"' >> "$f"
            # Google sign-in: the OAuth client id is public (it ships in the page); the API checks the token's audience against the same value.
            echo 'NEXT_PUBLIC_GOOGLE_CLIENT_ID="740109723206-hjhee8qvdt8ieloktujsjn025uh449rq.apps.googleusercontent.com"' >> "$f"
            echo 'NEXT_PUBLIC_SITE_URL="https://www.readprism.news"' >> "$f"
            echo "patched $f"
          done

      - name: Build with Vercel
        if: steps.web.outputs.changed == 'true'
        # Retries only a next/font Google fetch failure (web/scripts/retry-next-font.sh).
        run: web/scripts/retry-next-font.sh vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        if: steps.web.outputs.changed == 'true'
        run: |
          url=$(vercel deploy --prebuilt --archive=tgz --prod --meta prismSha=${{ github.sha }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to $url"
          echo "### :rocket: Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
